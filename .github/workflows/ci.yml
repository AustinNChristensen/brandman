name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run python scripts/build_dashboard.py
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Keep generated dashboard assets out of Git
        run: test -z "$(git ls-files ../brandman/static/app)" && git diff --exit-code
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: brandman:ci
      - name: Image starts and serves the dashboard
        run: |
          docker run -d --name brandman -p 127.0.0.1:8000:8000 \
            -e BRANDMAN_PREVIEW_PASSWORD=ci-only-password-1234 \
            -e BRANDMAN_TRUSTED_LOCAL_NETWORKS=172.16.0.0/12 brandman:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          curl -fsS -u operator:ci-only-password-1234 http://localhost:8000/api/brands
          docker logs brandman

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # uv builds the wheel from the sdist, exercising the source archive too.
      - run: uv build
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python scripts/check_dashboard_package.py
