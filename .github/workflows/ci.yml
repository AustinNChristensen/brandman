name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cloud-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install proof interpreter
        run: uv python install 3.11
      - name: Prove locked published-wheel wrapper without source or Node tooling
        run: uv run --no-project --python 3.11 python scripts/check_cloud_wrapper.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run python scripts/build_dashboard.py
      - run: uv run pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Keep generated dashboard assets out of Git
        run: test -z "$(git ls-files ../brandman/static/app)" && git diff --exit-code
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: brandman:ci
      - name: Image starts and serves the dashboard
        run: |
          docker run -d --name brandman -p 127.0.0.1:8000:8000 \
            -e BRANDMAN_PREVIEW_PASSWORD=ci-only-password-1234 \
            -e BRANDMAN_TRUSTED_LOCAL_NETWORKS=172.16.0.0/12 brandman:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          curl -fsS -u operator:ci-only-password-1234 http://localhost:8000/api/brands
          docker logs brandman

  clean-checkout:
    # No manual build step: the app builds the dashboard itself on startup from a
    # fresh checkout, and refuses to start when it cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked --no-dev
      - name: Missing dashboard fails at startup, not on a request
        run: |
          set +e
          BRANDMAN_AUTO_BUILD_DASHBOARD=false BRANDMAN_DATABASE_PROFILE=development BRANDMAN_DB=/tmp/startup-fail.db \
            .venv/bin/python -m uvicorn brandman.main:app --port 8001 > startup.log 2>&1
          status=$?
          cat startup.log
          test "$status" -ne 0
          grep -q "dashboard build is missing" startup.log
      - name: Fresh checkout builds the dashboard on startup and serves /app
        run: |
          test ! -e brandman/static/app/index.html
          BRANDMAN_DB=/tmp/clean.db BRANDMAN_DATABASE_PROFILE=development \
          BRANDMAN_PREVIEW_PASSWORD=ci-only-password-1234 \
          BRANDMAN_TRUSTED_LOCAL_NETWORKS=127.0.0.0/8 \
            .venv/bin/python -m uvicorn brandman.main:app --port 8000 > server.log 2>&1 &
          for i in $(seq 1 180); do curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS -u operator:ci-only-password-1234 http://127.0.0.1:8000/app | grep -q '<div id="root"'
          cat server.log

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # uv builds the wheel from the sdist, exercising the source archive too.
      - run: uv build
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python scripts/check_dashboard_package.py
      - name: Wheel metadata carries the README and project URLs
        run: |
          meta=$(unzip -p dist/*.whl '*/METADATA')
          version=$(uv version --short)
          printf '%s\n' "$meta" | grep -q 'mcp-name: io.github.AustinNChristensen/brandman'
          printf '%s\n' "$meta" | grep -q 'Project-URL: Homepage, https://github.com/AustinNChristensen/brandman'
          printf '%s\n' "$meta" | grep -q "^Version: ${version}$"
      - name: Clean install can approve a draft and reach MCP
        run: PATH="$PWD/.package-venv/bin:$PATH" .package-venv/bin/python scripts/smoke_operator_path.py
      - name: Prove the exact wheel runs without Node or source
        run: bash scripts/check_python_only_wheel.sh
      - name: Upload runtime artifact receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-runtime-receipts
          path: release-receipts.txt
          if-no-files-found: error

  release-dry-run:
    uses: ./.github/workflows/release-build.yml
