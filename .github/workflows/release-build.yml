name: Release build (no publishing)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check release tag matches the package version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version ${version}"; exit 1; }
      # uv builds the wheel from the sdist, including the dashboard build hook.
      - run: uv build
      - run: uv venv .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - run: .package-venv/bin/python scripts/check_dashboard_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image without registry login or push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: brandman:release-dry-run
      - name: Image serves the packaged dashboard
        run: |
          docker run -d --name release-dry-run -p 127.0.0.1:8000:8000 \
            -e BRANDMAN_PREVIEW_PASSWORD=dry-run-only-password-1234 \
            -e BRANDMAN_TRUSTED_LOCAL_NETWORKS=172.16.0.0/12 brandman:release-dry-run
          trap 'docker logs release-dry-run; docker rm -f release-dry-run' EXIT
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 1; done
          curl -fsS -u operator:dry-run-only-password-1234 http://localhost:8000/app | grep 'id="root"'
