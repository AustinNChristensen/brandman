name: Bug report
description: Something in BrandMan does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do not file them here. See SECURITY.md.
        Do not paste API keys, tokens, `.env` contents or database files.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. brandman init ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BrandMan version
      description: Output of `pip show brandman`, or the commit if you run from source.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - pip / uv / pipx install
        - Docker or Compose
        - Source checkout
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets first.
