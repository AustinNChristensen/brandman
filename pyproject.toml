[project]
name = "brandman"
version = "0.1.0"
description = "AI-native canonical brand and content control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "langchain-core>=0.3,<2",
  "cryptography>=43,<51",
]

[project.optional-dependencies]
# Optional built-in drafting (brandman/drafting.py). Agents over MCP need none of it.
anthropic = ["anthropic>=1.12,<2"]

[project.scripts]
brandman = "brandman.cli:main"
brand-os-mcp = "brandman.mcp_server:main"
brand-os-worker = "brandman.worker_cli:main"
brand-os-bootstrap = "brandman.bootstrap_cli:main"
brand-os-ops = "brandman.ops_cli:main"
brand-os-supervisor = "brandman.launchd_supervisor:main"
brand-os-api-supervisor = "brandman.api_supervisor:main"
# brandman-* are the primary names; brand-os-* remain as aliases for existing setups.
brandman-mcp = "brandman.mcp_server:main"
brandman-worker = "brandman.worker_cli:main"
brandman-bootstrap = "brandman.bootstrap_cli:main"
brandman-ops = "brandman.ops_cli:main"
brandman-supervisor = "brandman.launchd_supervisor:main"
brandman-api-supervisor = "brandman.api_supervisor:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "brandman.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brandman"]
# The dashboard is added once, by the build hook (force-include ignores this).
# Without it, a build outside git (e.g. Docker) would add the folder twice.
exclude = ["/brandman/static/app"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/brandman", "/web", "/scripts", "/tests", "/hatch_build.py", "/pyproject.toml",
  "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE*", "/docs",
]
exclude = ["/brandman/static/app"]
