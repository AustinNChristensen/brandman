[project]
name = "brandman"
version = "0.1.0"
description = "AI-native canonical brand and content control plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "langchain-core>=0.3,<2",
  "cryptography>=43,<51",
]

[project.scripts]
brand-os-mcp = "app.mcp_server:main"
brand-os-worker = "app.worker_cli:main"
brand-os-bootstrap = "app.bootstrap_cli:main"
brand-os-ops = "app.ops_cli:main"
brand-os-supervisor = "app.launchd_supervisor:main"
brand-os-api-supervisor = "app.api_supervisor:main"
# brandman-* are the primary names; brand-os-* remain as aliases for existing setups.
brandman-mcp = "app.mcp_server:main"
brandman-worker = "app.worker_cli:main"
brandman-bootstrap = "app.bootstrap_cli:main"
brandman-ops = "app.ops_cli:main"
brandman-supervisor = "app.launchd_supervisor:main"
brandman-api-supervisor = "app.api_supervisor:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.fastapi]
entrypoint = "app.main:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/app", "/web", "/scripts", "/tests", "/hatch_build.py", "/pyproject.toml",
  "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE*",
]
exclude = ["/app/static/app"]
